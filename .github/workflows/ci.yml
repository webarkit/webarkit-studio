name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # The e2e suite alone takes about 18 min (#108): room for it and the steps before it.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # AGENTS.md and the per-tool pointer files stay in sync with the repository.
      - run: npm run check:agents
      # Demo datasets + test photo (downloaded from webarkit/jsartoolkitNFT, not committed).
      - run: npm run assets
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Build (studio + standalone player)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      # Also on a cancelled run (a timeout): what ran is still worth reading.
      - uses: actions/upload-artifact@v6
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  bench:
    # Informational: numbers from shared CI runners are noisy; compare runs, not absolutes.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run bench | tee bench.txt
      - run: cat bench.txt >> "$GITHUB_STEP_SUMMARY"
