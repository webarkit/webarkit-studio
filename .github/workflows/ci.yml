name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # About 2 min: the e2e suite runs in the e2e job, split across runners (#164).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # AGENTS.md and the per-tool pointer files stay in sync with the repository.
      - run: npm run check:agents
      # Demo datasets + test photo (downloaded from webarkit/jsartoolkitNFT, not committed).
      - run: npm run assets
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Build (studio + standalone player)
        run: npm run build

  e2e:
    # The e2e suite on four runners, a quarter each (#164): 38.5 min in one job before, 487 tests. Each runner keeps one
    # worker (playwright.config.ts), so the rule of one test at a time holds per machine; fullyParallel makes --shard
    # split by test, not by file. The web server builds the app itself (playwright.config.ts).
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npx playwright install --with-deps chromium
      # A step timeout below the job's: a slow shard fails this step, and the report below uploads under failure()
      # while the job is still alive. A job timeout cancels the job, which runs only the cancelled() steps, if any.
      - name: End-to-end tests (shard ${{ matrix.shard }} of 4)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
        timeout-minutes: 20
      # On a failure, and on a cancelled run too: what ran is still worth reading.
      - uses: actions/upload-artifact@v6
        if: failure() || cancelled()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-done:
    # One check for branch protection to require, whatever the number of shards: it fails unless every shard passed.
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every e2e shard passed
        run: test "${{ needs.e2e.result }}" = success

  bench:
    # Informational: numbers from shared CI runners are noisy; compare runs, not absolutes.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run bench | tee bench.txt
      - run: cat bench.txt >> "$GITHUB_STEP_SUMMARY"
