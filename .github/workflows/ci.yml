name: CI

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Demo datasets + test photo (downloaded from webarkit/jsartoolkitNFT, not committed).
      - run: npm run assets
      - run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Build (studio + standalone player)
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  bench:
    # Informational: numbers from shared CI runners are noisy; compare runs, not absolutes.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run bench | tee bench.txt
      - run: cat bench.txt >> "$GITHUB_STEP_SUMMARY"
