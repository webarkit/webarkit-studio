<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebARKit Studio Player</title>
    <style>
      html, body { margin: 0; background: #000; color: #ddd; font: 14px system-ui, sans-serif; }
      #stage { max-width: 100vw; max-height: 100vh; margin: 0 auto; }
      #start { position: fixed; inset: 0; margin: auto; width: 180px; height: 56px; font-size: 18px; }
      #error { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px; background: #600; white-space: pre-wrap; display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <button id="start">▶ Start AR</button>
    <div id="error"></div>
    <script type="module" src="/src/app/player.ts"></script>
  </body>
</html>
